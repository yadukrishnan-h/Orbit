name: Flutter CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze_and_test:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated files (build_runner)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git --no-pager diff --exit-code -- . ':(exclude)pubspec.lock'

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit tests
        run: flutter test

      - name: Verify release compilation with Dart obfuscation
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Archive release APK and debug symbols [REV-001]
        uses: actions/upload-artifact@v4
        with:
          name: orbit-release-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/symbols
          if-no-files-found: error
